<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detail Produk | SaKe</title>

    <!-- Font Inter agar teks terlihat rapi dan modern -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="dtlbwg.css">
</head>

<body>

    <!-- KARTU UTAMA DETAIL PRODUK -->
    <main class="product-card">
        <div class="card-body">

            <!-- TOMBOL KEMBALI (RATA KIRI ATAS) -->
            <div class="top-bar">
                <button type="button" class="btn-back" onclick="history.back()">
                    <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.2" aria-hidden="true">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M10.5 19.5L3 12m0 0l7.5-7.5M3 12h18" />
                    </svg>
                    <span>Kembali</span>
                </button>
            </div>

            <!-- Pesan jika produk tidak ditemukan -->
            <div id="tidakDitemukan" hidden>
                <h1 class="product-title">Produk tidak ditemukan</h1>
                <p class="rating-text">Silakan kembali dan pilih produk dari daftar.</p>
            </div>

            <!-- KONTEN 2 KOLOM: FOTO (KIRI) & DETAIL (KANAN) - diisi otomatis oleh detail.js -->
            <div class="product-grid" id="detailProduk">

                <!-- BAGIAN FOTO PRODUK -->
                <div class="photo-wrapper">
                    <div class="photo-placeholder">
                        <strong>Foto belum tersedia</strong>
                    </div>
                    <img id="fotoProduk" alt="" class="product-image" onerror="this.style.display='none'">
                </div>

                <!-- BAGIAN INFO PRODUK & ULASAN -->
                <section class="product-info">
                    <h1 class="product-title" id="namaProduk"></h1>
                    <p class="product-price" id="hargaProduk"></p>

                    <!-- Rating Produk -->
                    <div class="rating-summary">
                        <span class="stars" id="bintangProduk"></span>
                        <span class="rating-text" id="ratingProduk"></span>
                        <span class="penjualan-text" id="terjualProduk"></span>
                    </div>

                    <hr class="divider">

                    <!-- BAGIAN ULASAN PEMBELI -->
                    <h2 class="reviews-title">Ulasan Pembeli</h2>
                    <div class="review-list" id="daftarUlasan"></div>

                    <!-- TOMBOL AKSI TAMBAH -->
                    <div class="action-area">
                        <button type="button" class="btn-add" onclick="tambahProduk()">
                            <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"
                                aria-hidden="true">
                                <path stroke-linecap="round" stroke-linejoin="round"
                                    d="M2.25 3h1.386c.51 0 .955.343 1.087.835l.383 1.437M7.5 14.25a3 3 0 00-3 3h15.75m-12.75-3h11.218c1.121-2.3 2.1-4.684 2.924-7.138a60.114 60.114 0 00-16.536-1.84M7.5 14.25L5.106 5.272M6 20.25a.75.75 0 11-1.5 0 .75.75 0 011.5 0zm12.75 0a.75.75 0 11-1.5 0 .75.75 0 011.5 0z" />
                            </svg>
                            <span>Tambah</span>
                        </button>
                    </div>
                </section>

            </div>
        </div>

        <!-- BAGIAN FOOTER -->
        <footer class="card-footer">
            <span class="footer-tagline">Juaranya Sambal Kemasan</span>
            <span>&copy; 2026 SaKe. All rights reserved.</span>
        </footer>
    </main>

    <!-- NOTIFIKASI TOAST SEDERHANA -->
    <div id="toastNotif" class="toast" role="status" aria-live="polite">
        <span class="toast-dot"></span>
        <span id="teksToast"></span>
    </div>

    <!-- Daftar produk & isi halaman -->
    <script src="products.js"></script>
    <script src="cart.js"></script>
    <script src="detail.js"></script>

</body>

</html>
